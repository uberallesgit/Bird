name: Build Kivy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Позволяет запускать сборку вручную

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9' # Стабильная версия для сборки

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev libssl-dev

      - name: Install Buildozer (latest master)
        run: |
          pip install --upgrade pip
          pip install git+https://github.com/kivy/buildozer.git
          pip install cython==0.29.34

      - name: Build APK with Buildozer
        run: |
          # Очистка кеша (опционально, но полезно при ошибках)
          rm -rf ~/.buildozer
          yes | buildozer -v android debug
          
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cteso-apk
          path: bin/*.apk
